name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_exam_variator/package-lock.json

      - name: Build frontend (static export)
        working-directory: frontend_exam_variator
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend_exam_variator
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        working-directory: backend_exam_variator
        run: pyinstaller exam_variator.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamVariator-windows
          path: backend_exam_variator/dist/ExamVariator.exe
